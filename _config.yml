# 小黑程序员 · Hexo 站点配置
# 改完后执行: npm run dev

title: 小黑程序员
subtitle: AI大模型应用开发
description: 记录大模型学习与行业热点思考。拆开模型，接进业务。
keywords: LLM,RAG,Agent,NLP,深度学习,Python,AI应用开发
author: zhanglichen
language: zh-CN
timezone: Asia/Shanghai

# 站点已绑定自定义域名 lczhang.blog.cn（source/CNAME 同步维护）
url: https://lczhang.blog.cn
root: /
# 用 abbrlink 生成短且稳定的链接：以后改文件名或在 notes/thoughts 之间移动文章，URL 都不会变。
# 原来的 posts/:year/:month/:day/:title/ 会把目录名拼进标题，得到
# /posts/2025/09/12/notes-2025-09-12-rag-minimal/ 这种又长又冗余的地址。
permalink: posts/:abbrlink/
abbrlink:
  alg: crc32
  rep: dec
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  auto_detect: true
  line_number: true
  line_threshold: 0
  wrap: true
  hljs: true
  exclude_languages:
    - mermaid
prismjs:
  preprocess: true
  line_number: true
  line_threshold: 0
  tab_replace: ''

index_generator:
  path: ''
  per_page: 8
  order_by: -date

default_category: Python
category_map:
tag_map:

markdown:
  preset: default
  render:
    html: true
    xhtmlOut: false
    breaks: true
    linkify: true
    typographer: true
  anchors:
    level: 2
    collisionSuffix: ''
    permalink: false

# 分页
per_page: 8
pagination_dir: page

theme: xiaohei

# 部署到 GitHub Pages（仓库已改名为 lczhang.blog.cn，自定义域名见 source/CNAME）
deploy:
  type: git
  repo: git@github.com:zhanglichen0711/lczhang.blog.cn.git
  branch: main

feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: false
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date

sitemap:
  path: sitemap.xml
