giscus:
  enable: true
  # repo_id / category_id 必须填，否则评论区不渲染（避免留下空标题）
  # 获取方式：打开 https://giscus.app → 填入仓库 zhanglichen0711/zhanglichen0711.github.io
  #          → 页面底部「启用 giscus」区块里会生成这两串 ID，复制回来即可
  repo: zhanglichen0711/zhanglichen0711.github.io
  repo_id: ""
  category: Announcements
  category_id: ""
  mapping: pathname
  strict: "0"
  reactions: "1"
  emit_metadata: "0"
  input_position: bottom
  theme_light: light
  theme_dark: transparent_dark
  lang: zh-CN
  loading: lazy

