# 主题 xiaohei · 文档站布局
english_name: Eason
slogan: Split the model. Ship the system.
slogan_zh: 拆开模型，接进业务。

avatar: /img/avatar.jpg
favicon: /img/favicon.png
cover: /img/cover.jpg
wechat_qr: /img/wechat-qr.jpg

# 前两项是板块页，由 scripts/sections.js 按 _posts 下的目录生成（不改动任何文章）
tabs:
  学习笔记: /notes/
  行业思考: /thoughts/
  归档: /archives/
  关于: /about/

sidebar:
  - id: notes
    label: 学习笔记
    children:
      - { name: Python, path: /categories/Python/, icon: code }
      - { name: MySQL, path: /categories/MySQL/, icon: db }
      - { name: Redis, path: /categories/Redis/, icon: cache }
      - { name: Machine Learning, path: /categories/Machine-Learning/, icon: chart }
      - { name: Deep Learning, path: /categories/Deep-Learning/, icon: net }
      - { name: NLP, path: /categories/NLP/, icon: text }
      - { name: RAG, path: /categories/RAG/, icon: search }
      - { name: Milvus, path: /categories/Milvus/, icon: hex }
      - { name: Agent, path: /categories/Agent/, icon: bot }
  - id: thoughts
    label: 行业思考
    children:
      - { name: Dynamics, path: /categories/Dynamics/, icon: news }
      - { name: Job Trends, path: /categories/Job-Trends/, icon: job }
      - { name: How to Learn, path: /categories/How-to-Learn/, icon: book }
  - id: library
    label: 站点
    children:
      - { name: Archives, path: /archives/, icon: archive }
      - { name: About, path: /about/, icon: user }
      - { name: Friends, path: /links/, icon: link }

social:
  github: https://github.com/zhanglichen0711
  rss: /atom.xml

giscus:
  enable: true
  # repo_id / category_id 必须填，否则评论区不渲染（避免留下空标题）
  # 获取方式：打开 https://giscus.app → 填入仓库 zhanglichen0711/zhanglichen0711.github.io
  #          → 页面底部「启用 giscus」区块里会生成这两串 ID，复制回来即可
  repo: zhanglichen0711/zhanglichen0711.github.io
  repo_id: ""
  category: Announcements
  category_id: ""
  mapping: pathname
  strict: "0"
  reactions: "1"
  emit_metadata: "0"
  input_position: bottom
  theme_light: light
  theme_dark: transparent_dark
  lang: zh-CN
  loading: lazy

search: true
reading_progress: true
toc: true
related_posts: true
related_count: 3
footer: © 2026 Eason · 小黑程序员
